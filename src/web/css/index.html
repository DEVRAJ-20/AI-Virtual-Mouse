<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Proton</title>
    
    <!-- Eel JS -->
    <script type="text/javascript" src="/eel.js"></script>
    
    <!-- Chat form CSS -->
    <link rel="stylesheet" type="text/css" href="css/jquery.convform.css">
    
    <!-- Font Awesome (optional, for chat icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #messages {
            overflow-y: auto;
            height: 400px;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        .message.from {
            text-align: right;
            color: white;
            background-color: #007bff;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 10px;
        }
        .message.to {
            text-align: left;
            color: black;
            background-color: #e5e5e5;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 10px;
        }
        #convForm {
            display: flex;
            align-items: center;
            padding: 5px;
            position: relative;
        }
        #userInput {
            flex: 1;
            padding: 5px;
        }
        #userInputButton {
            margin-left: 5px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-wrapper">
            <p class="awesome">PROTON Welcomes you!</p>
            <div class="logo">
                <img src="images/icon.png" width="35" height="33">
            </div>
        </div>
    </header>

    <!-- Chat Box -->
    <div class="chat_box">

        <!-- Messages container -->
        <div class="conv-form-wrapper">
            <div id="messages">
                <br><br>
            </div>
        </div>

        <!-- Input form -->
        <div id="convForm">
            <input type="text" id="userInput" placeholder="Type Here">
            <button id="userInputButton" type="button">▶</button>
        </div>

    </div>

    <!-- JS -->
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
